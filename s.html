<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة التميز – اختبار</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#eef3f7;color:#1f2937;font-size:17px;line-height:1.7}
.top{background:linear-gradient(135deg,#1e4f86,#3f8fc9);color:#fff;padding:18px 16px;text-align:center}
.top b{display:block;font-size:22px}.top small{opacity:.9}
.w{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd8e3;border-radius:12px;font:inherit}
.o{display:block;border:2px solid #dbe3ec;border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.o.on{border-color:#2f8f3a;background:#eef8ee}
.q b{display:block;margin-bottom:4px}
.yn{display:flex;gap:8px}.yn .o{flex:1;text-align:center;margin:6px 0}
button.go{width:100%;border:0;border-radius:12px;background:#2f8f3a;color:#fff;font:inherit;font-weight:700;padding:14px;font-size:18px;cursor:pointer}
button.go:disabled{opacity:.6}
.msg{text-align:center;padding:20px}.err{color:#b91c1c}
.bar{height:8px;background:#e5e9ee;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#2f8f3a}
</style></head><body>
<div class="top"><b id="ti">منصة التميز التعليمية</b><small id="su">جاري التحميل…</small></div>
<div class="w" id="app"><div class="card msg">جاري تحميل الاختبار…</div></div>
<script>
var P = new URLSearchParams(location.search), D = P.get('d'), TID = P.get('t'), U = 'https://script.google.com/macros/s/' + D + '/exec', DEF = null, ANS = [];
var ar = function (n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var $ = function (i) { return document.getElementById(i); };
function jsonp(url) { return new Promise(function (res, rej) { var cb = '__g' + Date.now() + Math.floor(Math.random() * 1e4), s = document.createElement('script'), t; function done() { clearTimeout(t); delete window[cb]; s.remove(); } t = setTimeout(function () { done(); rej(); }, 25000); window[cb] = function (j) { done(); res(j); }; s.onerror = function () { done(); rej(); }; s.src = url + '&cb=' + cb; document.head.appendChild(s); }); }
function get(q) { return fetch(U + '?' + q).then(function (r) { return r.json(); }).catch(function () { return jsonp(U + '?' + q); }); }
function post(b) { var s = JSON.stringify(b); return fetch(U, { method: 'POST', body: s }).then(function (r) { return r.json(); }).catch(function () { return jsonp(U + '?a=post&b=' + encodeURIComponent(s)); }); }
function fail(m) { $('app').innerHTML = '<div class="card msg err">' + esc(m) + '</div>'; $('su').textContent = ''; }
if (!D || !TID) fail('الرابط ناقص. اطلب من معلمك الرابط مرة ثانية.');
else get('a=test&t=' + encodeURIComponent(TID)).then(function (j) { if (!j.ok) return fail(j.err || 'تعذر فتح الاختبار'); DEF = j.def; draw(); }).catch(function () { fail('تعذر الاتصال. تأكد من الإنترنت ثم أعد فتح الرابط.'); });
function draw() {
  var sty = DEF.kind === 'sty';
  $('ti').textContent = DEF.title; $('su').textContent = [DEF.subj, DEF.cls].filter(Boolean).join(' • ');
  var h = '<div class="card"><b>اسمك</b>' + (DEF.names && DEF.names.length ? '<select id="nm"><option value="">-- اختر اسمك --</option>' + DEF.names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' : '<input id="nm" placeholder="اكتب اسمك الثلاثي">') + '</div>';
  if (sty) h += '<div class="card" style="background:#fffbea">اقرأ كل عبارة واختر «نعم» إذا كانت تنطبق عليك، و«لا» إذا لم تنطبق.</div>';
  h += DEF.qs.map(function (q, i) {
    return '<div class="card q"><b>' + ar(i + 1) + ') ' + esc(q.q) + '</b>' + (sty ? '<div class="yn"><label class="o" data-q="' + i + '" data-v="1">نعم</label><label class="o" data-q="' + i + '" data-v="0">لا</label></div>' : q.o.map(function (o, k) { return '<label class="o" data-q="' + i + '" data-v="' + k + '">' + esc(o) + '</label>'; }).join('')) + '</div>';
  }).join('');
  h += '<div class="card"><div id="pr"></div><div class="bar"><i id="pb" style="width:0"></i></div><br><button class="go" id="send">إرسال الإجابات</button></div>';
  $('app').innerHTML = h;
  var prog = function () { var n = ANS.filter(function (x) { return x != null; }).length; $('pr').textContent = 'أجبت ' + ar(n) + ' من ' + ar(DEF.qs.length); $('pb').style.width = (n / DEF.qs.length * 100) + '%'; };
  ANS = DEF.qs.map(function () { return null; }); prog();
  document.querySelectorAll('.o').forEach(function (el) { el.onclick = function () { var i = +el.dataset.q; ANS[i] = +el.dataset.v; document.querySelectorAll('.o[data-q="' + i + '"]').forEach(function (x) { x.classList.toggle('on', x === el); }); prog(); }; });
  $('send').onclick = function () {
    var nm = $('nm').value.trim(); if (!nm) { alert('اكتب اسمك أولاً'); $('nm').focus(); return; }
    var miss = ANS.indexOf(null); if (miss >= 0 && !confirm('لم تجب على ' + ar(ANS.filter(function (x) { return x == null; }).length) + ' سؤال. هل تريد الإرسال؟')) return;
    var b = this; b.disabled = true; b.textContent = 'جاري الإرسال…';
    post({ a: 'submit', t: TID, name: nm, ans: ANS }).then(function (j) {
      if (!j.ok) { b.disabled = false; b.textContent = 'إرسال الإجابات'; return alert(j.err || 'تعذر الإرسال'); }
      $('app').innerHTML = '<div class="card msg"><div style="font-size:54px">✅</div><b>تم إرسال إجاباتك بنجاح</b><br>شكراً ' + esc(nm) + (j.score != null ? '<br><br>درجتك: <b>' + ar(j.score) + ' من ' + ar(j.total) + '</b>' : '') + '</div>';
    }).catch(function () { b.disabled = false; b.textContent = 'إرسال الإجابات'; alert('تعذر الإرسال. تأكد من الإنترنت وحاول مرة ثانية.'); });
  };
}
</script></body></html>
