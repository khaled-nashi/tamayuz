:root{--bg:#f4f6f8;--card:#fff;--ink:#1b2530;--mut:#66727e;--line:#e1e6eb;--acc:#1e5a7a;--acc2:#e8f1f6;--gold:#b98a2e;--ok:#15803d;--okb:#e8f5ec;--warn:#b45309;--warnb:#fdf3e3;--bad:#b91c1c;--badb:#fdecec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc)}
ol{list-style:arabic-indic}
header{background:var(--acc);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;flex:1;display:flex;align-items:center;gap:8px}
header .logo{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:18px}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:9px;padding:6px 12px;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:18px}
.mut{color:var(--mut);font-size:14px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.hidden{display:none!important}
.msg{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.msg.e{background:var(--badb);color:var(--bad)}.msg.w{background:var(--warnb);color:var(--warn)}.msg.s{background:var(--okb);color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink);display:block}
.tile:hover{border-color:var(--acc)}
.tile .ic{font-size:30px;display:block;margin-bottom:6px}
.tile b{display:block;font-size:16px}.tile span{font-size:13px;color:var(--mut)}
.crumb{font-size:14px;color:var(--mut);margin-bottom:10px}.crumb a{cursor:pointer;text-decoration:none}
.list button{display:flex;width:100%;text-align:right;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.list button b{flex:1}.list button .n{background:var(--acc2);color:var(--acc);border-radius:8px;padding:2px 9px;font-size:13px}
.list .unit{font-weight:700;color:var(--acc);margin:16px 0 8px;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fld{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.fld .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fld .h b{flex:1;color:var(--acc)}
.fld ul,.fld ol{margin:0;padding-inline-start:22px}
.fld p{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.q{margin-bottom:12px}.q .opts{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;padding-inline-start:14px}
.badge{display:inline-block;background:#f3ead8;color:var(--gold);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:15px;z-index:20;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.login{max-width:420px;margin:30px auto}
.login .hero{text-align:center;margin-bottom:16px}
.login .hero .logo{width:64px;height:64px;border-radius:18px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:700;margin:0 auto 10px}
.codes{font-family:ui-monospace,monospace;direction:ltr;text-align:left;white-space:pre;background:#f6f8fa;border-radius:10px;padding:12px;font-size:15px;overflow:auto}
.land-hero{background:linear-gradient(160deg,#1e5a7a,#173f56);color:#fff;border-radius:18px;padding:28px 18px;text-align:center;margin-bottom:14px}
.land-hero .logo{width:64px;height:64px;border-radius:18px;background:#fff;color:var(--acc);display:grid;place-items:center;font-size:32px;font-weight:700;margin:0 auto 10px}
.land-hero h1{margin:0 0 6px;font-size:24px}.land-hero p{margin:0 auto;max-width:520px;opacity:.9}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.feats div{background:var(--bg);border-radius:12px;padding:12px}.feats span{font-size:24px}.feats b{display:block}.feats p{margin:2px 0 0;font-size:14px;color:var(--mut)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.plan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;position:relative}
.plan.best{border:2px solid var(--acc)}.plan .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;border-radius:20px;padding:1px 14px;font-size:13px;font-weight:700}
.plan .price{font-size:34px;font-weight:700;color:var(--acc);margin-top:6px}.plan ul{text-align:right;padding-inline-start:20px;font-size:14px;min-height:96px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:6px 16px 26px}
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  header,main,footer,.toast{display:none!important}
  #print{display:block;font-size:12.5pt;color:#000}
  #print h1{font-size:17pt;text-align:center;margin:0 0 4px}
  #print .meta{display:flex;justify-content:space-between;font-size:11pt;border-bottom:1px solid #bbb;padding-bottom:6px;margin-bottom:10px}
  #print table{width:100%;border-collapse:collapse;margin-bottom:8px}
  #print th,#print td{border:1px solid #bbb;padding:6px 8px;vertical-align:top;text-align:right}
  #print th{background:#eeeeee;width:24%}
  #print ul,#print ol{margin:0;padding-inline-start:18px}
  #print .q{margin-bottom:14px;page-break-inside:avoid}
  #print .line{border-bottom:1px dotted #999;height:22px}
  #print .sign{margin-top:18px;display:flex;justify-content:space-between;font-size:11pt}
}
</style>

const SALT = 'tmz.k-nashi.1448.v1';
function fnv(s) { let h = 0x811c9dc5; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const enc = (n, len) => { let s = ''; for (let i = 0; i < len; i++) { s += ALPH[n % 32]; n = Math.floor(n / 32); } return s; };
const sig = a => enc((fnv(a + SALT) ^ fnv(SALT + a + a)) >>> 0, 4);
function makeCode() { const r = crypto.getRandomValues(new Uint32Array(1))[0]; const a = enc(r, 4); return `TMZ-${a}-${sig(a)}`; }
function validCode(c) { const m = String(c).toUpperCase().replace(/\s/g, '').match(/^TMZ-?([A-Z2-9]{4})-?([A-Z2-9]{4})$/); return !!m && sig(m[1]) === m[2]; }

  const { s, g, t } = ctx();
  let h = `<div class="crumb"><a data-h>الرئيسية</a> ‹ <a data-b>${MODE[nav.mode]}</a> ‹ ${s.name} – ${g.name}</div><div class="card"><h2>${t.name}</h2><div class="list">`;
  t.units.forEach(u => { h += `<div class="unit">${esc(u.name)}</div>`; u.lessons.forEach((l, i) => h += `<button data-l="${l.id}"><span class="n">${ar(i + 1)}</span><b>${esc(l.title)}</b>${l.sample ? '<span class="badge">نموذج</span>' : ''}</button>`); });
  h += '</div></div>';
  $('app').innerHTML = h;
  $('app').querySelector('[data-h]').onclick = () => go({ view: 'home' });
  $('app').querySelector('[data-b]').onclick = () => go({ view: 'subjects', mode: nav.mode });
  $('app').querySelectorAll('[data-l]').forEach(b => b.onclick = () => go(Object.assign({}, nav, { view: 'lesson', l: b.dataset.l })));
}
function lesson() { const { s, g, t } = ctx(); for (const u of t.units) for (const l of u.lessons) if (l.id === nav.l) return { s, g, t, u, l }; }

// ---------- lesson ----------
const PREP_FIELDS = [
  ['objectives', 'الأهداف', 'list'], ['vocab', 'المفردات', 'inline'], ['tools', 'الوسائل والأدوات', 'inline'], ['strategies', 'استراتيجيات التدريس', 'inline'],
  ['intro', 'التهيئة', 'text'], ['procedures', 'إجراءات الدرس', 'olist'], ['assessment', 'التقويم', 'list'], ['homework', 'الواجب', 'text']
];
const fieldText = (l, k, kind) => kind === 'text' ? l[k] : kind === 'inline' ? l[k].join('، ') : l[k].map((x, i) => (kind === 'olist' ? ar(i + 1) + '. ' : '- ') + x).join('\n');
function fieldHtml(l, k, kind) {
  if (kind === 'text') return `<p>${esc(l[k])}</p>`;
  if (kind === 'inline') return `<p>${l[k].map(esc).join('، ')}</p>`;
  const tag = kind === 'olist' ? 'ol' : 'ul'; return `<${tag}>${l[k].map(x => `<li>${esc(x)}</li>`).join('')}</${tag}>`;
}
function renderLesson() {
  const { s, g, t, l } = lesson();
  const tab = nav.mode;
  let h = `<div class="crumb"><a data-h>الرئيسية</a> ‹ <a data-b>${s.name} – ${g.name}</a></div>
    <div class="card"><h2 style="margin-bottom:4px">${esc(l.title)} ${l.sample ? '<span class="badge">نموذج</span>' : ''}</h2><p class="mut" style="margin:0">${s.name} • ${g.name} • ${t.name}</p></div>
    <div class="tabs">${Object.entries(MODE).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v === 'تحضير الدروس' ? 'التحضير' : v === 'أوراق العمل' ? 'ورقة العمل' : 'الاختبار القصير'}</button>`).join('')}</div>`;
  if (tab === 'prep') {
    h += `<div class="actions"><button class="btn p" id="pPrint">🖨 طباعة / PDF</button><button class="btn" id="pWord">⬇ ملف Word</button><button class="btn" id="pAll">نسخ التحضير كاملاً</button></div>
      <p class="mut" style="margin-top:0">لكل حقل زر «نسخ» لتلصقه مباشرة في الحقل المقابل في منصة مدرستي.</p>`;
    PREP_FIELDS.forEach(([k, n, kind]) => h += `<div class="fld"><div class="h"><b>${n}</b><button class="btn sm" data-cp="${k}">نسخ</button></div>${fieldHtml(l, k, kind)}</div>`);
  } else if (tab === 'ws') {
    h += `<div class="actions"><button class="btn p" id="wPrint">🖨 طباعة / PDF</button><button class="btn" id="wWord">⬇ ملف Word</button></div><div class="card">`;
    l.worksheet.forEach((q, i) => h += `<div class="q"><b>${ar(i + 1)}.</b> ${esc(q)}</div>`);
    h += '</div>';
  } else {
    h += `<div class="actions"><button class="btn p" id="qPrint">🖨 طباعة الاختبار</button><button class="btn" id="qWord">⬇ ملف Word</button><a class="btn" href="https://khaled-nashi.github.io/tasheeh/" target="_blank" rel="noopener">📝 صحّحه بالمصحح الآلي</a></div><div class="card">`;
    l.quiz.forEach((q, i) => h += `<div class="q"><b>${ar(i + 1)}.</b> ${esc(q.q)}<div class="opts">${q.o.map((o, k) => `<span style="${k === q.a ? 'color:var(--ok);font-weight:700' : ''}">${LET[k]}) ${esc(o)}</span>`).join('')}</div></div>`);
    h += `<div class="msg s" style="margin-bottom:0">مفتاح الإجابة: ${l.quiz.map((q, i) => ar(i + 1) + '-' + LET[q.a]).join('  ')}</div></div>`;
  }
  $('app').innerHTML = h;
  $('app').querySelector('[data-h]').onclick = () => go({ view: 'home' });
  $('app').querySelector('[data-b]').onclick = () => go(Object.assign({}, nav, { view: 'lessons' }));
  $('app').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(Object.assign({}, nav, { mode: b.dataset.tab })));
  $('app').querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { const f = PREP_FIELDS.find(x => x[0] === b.dataset.cp); copy(fieldText(l, f[0], f[2])); });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('pAll', () => copy(`${l.title}\n\n` + PREP_FIELDS.map(([k, n, kind]) => `${n}:\n${fieldText(l, k, kind)}`).join('\n\n')));
  on('pPrint', () => doPrint(prepDoc(l))); on('pWord', () => doWord(prepDoc(l), 'تحضير - ' + l.title));
  on('wPrint', () => doPrint(wsDoc(l))); on('wWord', () => doWord(wsDoc(l), 'ورقة عمل - ' + l.title));
  on('qPrint', () => doPrint(quizDoc(l))); on('qWord', () => doWord(quizDoc(l), 'اختبار قصير - ' + l.title));
}

// ---------- printable documents ----------
function head(l, title) {
  const { s, g } = lesson();
  return `<h1>${title}</h1><div class="meta"><span>${esc(profile.school || '')}</span><span>${s.name} – ${g.name}</span><span>الدرس: ${esc(l.title)}</span></div>`;
}
function prepDoc(l) {
  return head(l, 'تحضير درس') + `<table>${PREP_FIELDS.map(([k, n, kind]) => `<tr><th>${n}</th><td>${fieldHtml(l, k, kind)}</td></tr>`).join('')}</table>
    <div class="sign"><span>المعلم: ${esc(profile.name)}</span><span>التوقيع: ……………</span><span>مدير المدرسة: ……………</span></div>`;
}
function wsDoc(l) {
  return head(l, 'ورقة عمل') + `<p>اسم الطالب: ……………………………………  الفصل: ……………</p>` + l.worksheet.map((q, i) => `<div class="q"><b>${ar(i + 1)}.</b> ${esc(q)}<div class="line"></div></div>`).join('') + `<div class="sign"><span>المعلم: ${esc(profile.name)}</span><span>الدرجة: …… / ${ar(l.worksheet.length)}</span></div>`;
}
function quizDoc(l) {
  return head(l, 'اختبار قصير') + `<p>اسم الطالب: ……………………………………  الفصل: ……………</p><p style="font-size:11pt">اختر الإجابة الصحيحة:</p>` +
    l.quiz.map((q, i) => `<div class="q"><b>${ar(i + 1)}.</b> ${esc(q.q)}<div style="display:flex;gap:28px;margin-top:4px;padding-inline-start:16px">${q.o.map((o, k) => `<span>${LET[k]}) ${esc(o)}</span>`).join('')}</div></div>`).join('') +
    `<div class="sign"><span>المعلم: ${esc(profile.name)}</span><span>الدرجة: …… / ${ar(l.quiz.length)}</span></div>`;
}
function doPrint(html) { $('print').innerHTML = html; setTimeout(() => { try { window.print(); } catch (e) { toast('الطباعة غير متاحة هنا'); } }, 50); }
function doWord(html, name) {
  const css = `ol{list-style:arabic-indic}body{font-family:Tajawal,Arial;direction:rtl;font-size:13pt}h1{text-align:center;font-size:17pt}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:6px;vertical-align:top;text-align:right}th{background:#eeeeee;width:24%}.meta{border-bottom:1px solid #bbb;margin-bottom:10px}.meta span{margin-left:24px}.line{border-bottom:1px dotted #999;height:22px}.sign span{margin-left:40px}`;
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>${css}</style></head><body dir="rtl">${html}</body></html>`;
  download(name + '.doc', '﻿' + doc, 'application/msword');
}

// ---------- tools / profile ----------
function renderTools() {
  $('app').innerHTML = `<div class="crumb"><a data-h>الرئيسية</a> ‹ أدوات المعلم</div><div class="grid">` +
    DATA.tools.map(t => `<a class="tile" href="${t.url}" target="_blank" rel="noopener"><span class="ic">${t.icon}</span><b>${t.name}</b><span>${t.desc}</span></a>`).join('') + '</div>';
  $('app').querySelector('[data-h]').onclick = () => go({ view: 'home' });
}
function renderProfile() {
  $('app').innerHTML = `<div class="crumb"><a data-h>الرئيسية</a> ‹ حسابي</div><div class="card">
    <label class="f"><span>اسم المعلم (يظهر في المطبوعات)</span><input type="text" id="pfName" value="${esc(profile.name)}"></label>
    <label class="f"><span>اسم المدرسة</span><input type="text" id="pfSchool" value="${esc(profile.school)}"></label>
    <p class="mut">كود التفعيل: <span style="direction:ltr;display:inline-block">${esc(profile.code)}</span></p>
    <div class="row"><button class="btn p" id="pfSave">حفظ</button><button class="btn" id="pfOut">تسجيل الخروج</button></div></div>`;
  $('app').querySelector('[data-h]').onclick = () => go({ view: 'home' });
  $('pfSave').onclick = () => { profile.name = $('pfName').value.trim() || profile.name; profile.school = $('pfSchool').value.trim(); store.set('profile', profile); toast('✓ تم الحفظ'); };
  $('pfOut').onclick = () => { store.set('profile', null); profile = null; render(); };
}

// ---------- admin ----------
function renderAdmin() {
  $('hdr').classList.add('hidden');
  const ok = sessionStorageOk() && sessionStorage.getItem('tmz-admin') === '1';
  if (!ok) {
    $('app').innerHTML = `<div class="login"><div class="card"><h2>صفحة الإدارة</h2>
      <label class="f"><span>كلمة المرور</span><input type="password" id="aPw"></label><button class="btn p big" id="aGo">دخول</button><div id="aMsg"></div></div></div>`;
    $('aGo').onclick = () => { if (fnv($('aPw').value) === ADMIN_HASH) { try { sessionStorage.setItem('tmz-admin', '1'); } catch (e) {} renderAdminPanel(); } else $('aMsg').innerHTML = '<div class="msg e">كلمة المرور غير صحيحة.</div>'; };
    return;
  }
  renderAdminPanel();
}
function sessionStorageOk() { try { sessionStorage.getItem('x'); return true; } catch (e) { return false; } }
function renderAdminPanel() {
  $('app').innerHTML = `<div class="card"><h2>توليد أكواد التفعيل</h2>
    <p class="mut">ولّد كوداً لكل معلم مشترك وأرسله له. كل كود صالح للدخول.</p>
    <div class="row"><label class="f"><span>عدد الأكواد</span><input type="number" id="aN" value="10" min="1" max="500"></label></div>
    <div class="row"><button class="btn p" id="aGen">توليد</button><button class="btn" id="aCopy">نسخ الأكواد</button><a class="btn" href="#">خروج</a></div>
    <div class="codes" id="aOut" style="margin-top:12px">—</div>
    <h2 style="margin-top:18px">فحص كود</h2><div class="row"><input type="text" id="aChk" placeholder="TMZ-XXXX-XXXX" style="direction:ltr"><button class="btn" id="aChkB" style="flex:0 0 auto">فحص</button></div><div id="aChkM"></div></div>`;
  $('aGen').onclick = () => { const n = Math.max(1, Math.min(500, +$('aN').value || 10)); $('aOut').textContent = Array.from({ length: n }, makeCode).join('\n'); };
  $('aCopy').onclick = () => copy($('aOut').textContent);
  $('aChkB').onclick = () => $('aChkM').innerHTML = validCode($('aChk').value) ? '<div class="msg s">✓ كود صحيح</div>' : '<div class="msg e">كود غير صحيح</div>';
}

render();
</script>
</body>
